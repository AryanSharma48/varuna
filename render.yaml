services:
  - type: web
    name: varuna-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: sqlite:///./varuna_investigation.db
